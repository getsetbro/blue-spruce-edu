<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Locations - Blue Spruce High School</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-size: 24px;
    }

    main {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    main h2 {
      color: #2a4967;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .map-container {
      flex: 1;
      display: flex;
      gap: 20px;
      min-height: 400px;
    }

    #selected-list {
      width: 300px;
      background: white;
      border-radius: 8px;
      border: 2px solid #2a4967;
      overflow-y: auto;
      padding: 10px;
      text-align: left;
    }

    #selected-list h3 {
      margin: 0 0 10px 0;
      color: #2a4967;
      font-size: 1.2rem;
      text-align: center;
    }

    #selected-list .empty-message {
      color: #666;
      font-size: 14px;
      text-align: center;
      padding: 20px 0;
    }

    .load-notes-btn {
      width: 100%;
      background: #2a4967;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .load-notes-btn:hover {
      background: #1a3957;
    }

    .selected-card {
      background: #f4f4f9;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      position: relative;
      font-size: 14px;
      border-left: 4px solid #2a4967;
    }

    .selected-card.has-sat {
      border-left-color: #cb2b3e;
    }

    .selected-card.has-pnmsqt {
      border-left-color: #2a7bd6;
    }

    .selected-card.has-psat89 {
      border-left-color: #2aad27;
    }

    .selected-card .badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      margin-bottom: 4px;
      color: white;
    }

    .selected-card .badge.sat {
      background: #cb2b3e;
    }

    .selected-card .badge.pnmsqt {
      background: #2a7bd6;
    }

    .selected-card .badge.psat89 {
      background: #2aad27;
    }

    .selected-card .school-name {
      font-weight: bold;
      color: #2a4967;
      padding-right: 24px;
      text-decoration: none;
      display: block;
    }

    .selected-card .school-name:hover {
      text-decoration: underline;
    }

    .selected-card .address {
      color: #666;
      margin: 5px 0;
    }

    .selected-card .tests {
      font-size: 12px;
    }

    .selected-card .notes {
      font-size: 12px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #ccc;
    }

    .selected-card .copy-btn {
      background: #e8eef3;
      color: #2a4967;
      border: 1px solid #ccc;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .selected-card .copy-btn:hover {
      background: #d4e0e8;
    }

    .selected-card .copy-btn.copied {
      background: #2aad27;
    }

    .selected-card .notes-actions {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #ccc;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .selected-card .sheet-link {
      font-size: 11px;
      color: #2a4967;
    }

    .selected-card.highlighted {
      background: #d4e6f1;
      border: 2px solid #2a4967;
    }

    .selected-card .close-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #2a4967;
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      cursor: pointer;
      font-size: 12px;
      line-height: 20px;
      text-align: center;
      padding: 0;
    }

    .selected-card .close-btn:hover {
      background: #1a3957;
    }

    #map {
      flex: 1;
      min-height: 400px;
      border-radius: 8px;
      border: 2px solid #2a4967;
    }

    .leaflet-popup-content {
      font-size: 16px;
    }

    .location-name {
      font-weight: bold;
      color: #2a4967;
    }
  </style>
</head>

<body>
  <main>
    <div class="map-container">
      <div id="selected-list">
        <h3>Selected Schools</h3>
        <button id="load-notes-btn" class="load-notes-btn" onclick="loadSchoolsWithNotes()">📋 Load schools with notes</button>
        <div class="empty-message">Click a pin to add schools</div>
      </div>
      <div id="map"></div>
    </div>
  </main>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Google Sheet configuration
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1zH7NknB0LYfZDMtLG-re5NrTZxEM2h6SW0fDHFjTn1A/export?format=csv';
    const SHEET_VIEW_URL = 'https://docs.google.com/spreadsheets/d/1zH7NknB0LYfZDMtLG-re5NrTZxEM2h6SW0fDHFjTn1A/edit?usp=sharing';
    
    // Store notes from spreadsheet, keyed by aiCode
    let schoolNotes = new Map();

    // Parse CSV and build notes lookup
    async function loadSchoolNotes() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        const csvText = await response.text();
        const rows = csvText.trim().split('\n').map(row => {
          const result = [];
          let current = '';
          let inQuotes = false;
          for (let char of row) {
            if (char === '"') {
              inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
              result.push(current.trim());
              current = '';
            } else {
              current += char;
            }
          }
          result.push(current.trim());
          return result;
        });

        if (rows.length < 2) return;

        const headers = rows[0].map(h => h.toLowerCase());
        const aiCodeIndex = headers.indexOf('aicode');
        
        if (aiCodeIndex === -1) {
          console.warn('No aiCode column found in spreadsheet');
          return;
        }

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          const aiCode = row[aiCodeIndex];
          if (aiCode) {
            const noteData = {};
            headers.forEach((header, idx) => {
              if (header !== 'aicode' && row[idx]) {
                noteData[header] = row[idx];
              }
            });
            if (Object.keys(noteData).length > 0) {
              schoolNotes.set(aiCode, noteData);
            }
          }
        }
        console.log(`Loaded notes for ${schoolNotes.size} schools`);
      } catch (error) {
        console.error('Error loading school notes:', error);
      }
    }

    // Initialize the map centered on Ohio/Indiana border area
    const map = L.map('map').setView([39.9, -84.5], 6);

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Track selected schools
    const selectedSchools = new Map();

    // Store all schools data for lookup
    let allSchoolsData = [];

    // Load all schools that have notes in the spreadsheet
    function loadSchoolsWithNotes() {
      if (schoolNotes.size === 0) {
        alert('No notes found in spreadsheet');
        return;
      }
      
      for (const school of allSchoolsData) {
        if (schoolNotes.has(school.aiCode)) {
          const addr = school.mainAddress;
          const fullAddress = `${addr.addressLine1}, ${addr.city}, ${addr.state} ${addr.postalCd}`;
          addToSelectedList(school, fullAddress);
        }
      }
    }

    // Copy row data to clipboard
    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.textContent;
        btn.textContent = '✓ Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        console.error('Failed to copy:', err);
        alert('Failed to copy. Please copy manually: ' + text);
      });
    }

    function addToSelectedList(school, fullAddress) {
      const cardId = `card-${school.aiCode}`;
      
      // If already added, just highlight it
      if (selectedSchools.has(school.aiCode)) {
        highlightCard(cardId);
        return;
      }
      
      selectedSchools.set(school.aiCode, school);
      
      const listEl = document.getElementById('selected-list');
      const emptyMsg = listEl.querySelector('.empty-message');
      if (emptyMsg) emptyMsg.remove();
      
      const addr = school.mainAddress;
      const searchQuery = encodeURIComponent(`${school.schoolName} ${addr.city} ${addr.state}`);
      const googleUrl = `https://www.google.com/search?q=${searchQuery}`;
      
      // Determine card class based on test type (priority: SAT > PSAT 8/9 > PSAT/NMSQT)
      const hasSat = school.testDates.sat && school.testDates.sat.length > 0;
      const hasPnmsqt = school.testDates.pnmsqt && school.testDates.pnmsqt.length > 0;
      const hasPsat89 = school.testDates.psat89 && school.testDates.psat89.length > 0;
      let cardClass = 'selected-card';
      if (hasSat) cardClass += ' has-sat';
      else if (hasPsat89) cardClass += ' has-psat89';
      else if (hasPnmsqt) cardClass += ' has-pnmsqt';
      
      const card = document.createElement('div');
      card.className = cardClass;
      card.id = cardId;
      
      // Check for notes from spreadsheet - only show the "notes" column
      const notes = schoolNotes.get(school.aiCode);
      let notesHtml = '';
      // Match spreadsheet columns: aiCode, School Name, Test Type, Accommodations, Contact, Notes
      const rowData = `${school.aiCode}\t${school.schoolName}\t\t\t\t`;
      
      if (notes && notes.notes) {
        notesHtml = `<div class="notes"><strong>Notes:</strong> ${notes.notes}</div>`;
      }
      
      // Always show copy button and spreadsheet link
      notesHtml += `<div class="notes-actions">
        <button class="copy-btn" onclick="copyToClipboard('${rowData.replace(/'/g, "\\'")}', this)">📋 Copy row</button>
        <a href="${SHEET_VIEW_URL}" target="_blank" class="sheet-link">Open spreadsheet</a>
      </div>`;
      
      card.innerHTML = `
        <button class="close-btn" onclick="removeFromList('${school.aiCode}')">&times;</button>
        <a class="school-name" href="${googleUrl}" target="_blank">${school.schoolName}</a>
        <div class="address">${fullAddress}</div>
        <div class="tests"><strong>Tests:</strong><br>${formatTests(school.testDates)}</div>
        ${notesHtml}
      `;
      listEl.appendChild(card);
      highlightCard(cardId);
    }

    function highlightCard(cardId) {
      // Remove highlight from all cards
      document.querySelectorAll('.selected-card').forEach(c => c.classList.remove('highlighted'));
      // Add highlight to clicked card
      const card = document.getElementById(cardId);
      if (card) {
        card.classList.add('highlighted');
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function removeFromList(aiCode) {
      selectedSchools.delete(aiCode);
      const card = document.getElementById(`card-${aiCode}`);
      if (card) card.remove();
      
      // Show empty message if no schools selected
      if (selectedSchools.size === 0) {
        const listEl = document.getElementById('selected-list');
        const emptyMsg = document.createElement('div');
        emptyMsg.className = 'empty-message';
        emptyMsg.textContent = 'Click a pin to add schools';
        listEl.appendChild(emptyMsg);
      }
    }

    // Format test dates for display
    function formatTests(testDates) {
      const tests = [];
      if (testDates.sat && testDates.sat.length > 0) tests.push('<span class="badge sat">SAT</span> ' + testDates.sat.join(', '));
      if (testDates.pnmsqt && testDates.pnmsqt.length > 0) tests.push('<span class="badge pnmsqt">PSAT/NMSQT</span> ' + testDates.pnmsqt.join(', '));
      if (testDates.psat10 && testDates.psat10.length > 0) tests.push('PSAT 10: ' + testDates.psat10.join(', '));
      if (testDates.psat89 && testDates.psat89.length > 0) tests.push('<span class="badge psat89">PSAT 8/9</span> ' + testDates.psat89.join(', '));
      return tests.join('<br>');
    }

    // Custom marker icons
    const orangeIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const greenIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const blueIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const redIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    // Load and display schools (data is pre-filtered and pre-geocoded)
    async function loadSchools() {
      try {
        const response = await fetch('sat-data.json');
        const data = await response.json();
        allSchoolsData = data.hits; // Store for later lookup
        
        const markers = [];
        
        for (const school of data.hits) {
          const addr = school.mainAddress;
          const fullAddress = `${addr.addressLine1}, ${addr.city}, ${addr.state} ${addr.postalCd}`;
          
          // Choose icon color based on test types (priority: SAT > PSAT 8/9 > PSAT/NMSQT)
          const hasSat = school.testDates.sat && school.testDates.sat.length > 0;
          const hasPnmsqt = school.testDates.pnmsqt && school.testDates.pnmsqt.length > 0;
          const hasPsat89 = school.testDates.psat89 && school.testDates.psat89.length > 0;
          let icon = orangeIcon;
          if (hasSat) icon = redIcon;
          else if (hasPsat89) icon = greenIcon;
          else if (hasPnmsqt) icon = blueIcon;
          
          const marker = L.marker([school.lat, school.lng], { icon }).addTo(map);
          marker.on('click', () => addToSelectedList(school, fullAddress));
          markers.push(marker);
        }
        
        // Fit map to show all markers
        if (markers.length > 0) {
          const group = L.featureGroup(markers);
          map.fitBounds(group.getBounds().pad(0.1));
        }
      } catch (e) {
        console.error('Error loading schools:', e);
      }
    }

    // Load notes first, then schools
    loadSchoolNotes().then(() => loadSchools());
  </script>
</body>

</html>
